name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools
      - name: Ruff format check (informational)
        run: ruff format --check src tests tools || true
      - name: Docs links
        run: python tools/check_docs.py
      - name: CLI smoke test (hardware-free)
        run: |
          m241 --help
          m241 selftest
          m241 logs capacity
          m241 ports --json
          m241 doctor --simulate --json

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package is pure Python, so testing every OS x version combination
        # adds minutes without adding coverage. Cover the oldest and newest
        # supported interpreters on Linux, plus one representative version on
        # each other OS.
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  build:
    name: build (sdist + wheel, assert package data)
    runs-on: ubuntu-latest
    # Packaging does not depend on test results; waiting for the matrix only
    # delays the feedback.
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build backend
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Assert the wheel ships the JSON data files
        run: |
          python -c "import glob, sys, zipfile; w = glob.glob('dist/*.whl')[0]; names = set(zipfile.ZipFile(w).namelist()); required = {'m241/data/firmware_profiles.json', 'm241/data/vendor_drop.json'}; missing = sorted(required - names); print(w, 'OK' if not missing else 'MISSING ' + str(missing)); sys.exit(1 if missing else 0)"
          python -c "import glob, sys; sdists = glob.glob('dist/*.tar.gz'); print(sdists); sys.exit(0 if sdists else 1)"
      - name: Install the built wheel and run the CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          m241 --help
          m241 selftest
          m241 logs capacity
          python -c "from m241.firmware import list_profiles; print([p.name for p in list_profiles()])"
      - name: Verify the wheel in an isolated target
        run: python tools/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
