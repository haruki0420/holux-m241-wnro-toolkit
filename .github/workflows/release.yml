name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tools
      - name: Docs links
        run: python tools/check_docs.py
      - name: Tests
        run: pytest -q
      - name: The tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit is on main"
          else
            echo "::error::the tagged commit is not an ancestor of main"
            exit 1
          fi
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          declared = pyproject["project"]["version"]
          init = pathlib.Path("src/m241/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          module = match.group(1) if match else "(missing)"
          print(f"tag={tag} pyproject={declared} __version__={module}")
          if not (tag == declared == module):
              sys.exit("version mismatch: the tag, pyproject.toml and __init__.py must agree")
          PY
      - name: CHANGELOG has a section for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[{re.escape(tag)}\]", text, re.MULTILINE):
              sys.exit(f"CHANGELOG.md has no '## [{tag}]' section")
          print(f"CHANGELOG.md has a section for {tag}")
          PY

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify the artifacts
        run: |
          python -c "import glob, sys, zipfile; w = glob.glob('dist/*.whl')[0]; names = set(zipfile.ZipFile(w).namelist()); required = {'m241/data/firmware_profiles.json', 'm241/data/vendor_drop.json'}; missing = sorted(required - names); print(w, 'OK' if not missing else 'MISSING ' + str(missing)); sys.exit(1 if missing else 0)"
          python -c "import glob, sys, tarfile; s = glob.glob('dist/*.tar.gz')[0]; members = tarfile.open(s).getnames(); wanted = [n for n in members if n.endswith('src/m241/data/firmware_profiles.json') or n.endswith('src/m241/data/vendor_drop.json')]; print(s, wanted); sys.exit(0 if len(wanted) == 2 else 1)"
      - name: Install the wheel and smoke-test the CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          m241 --help
          m241 selftest
          m241 logs capacity
          python -m m241 --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          # A tag with a suffix (v1.1.0-rc1) is a pre-release, not "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
